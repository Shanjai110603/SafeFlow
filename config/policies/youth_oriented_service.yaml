# SafeFlow Youth-Oriented Service Policy Pack
# All numerical thresholds are uncalibrated research placeholders.

name: youth_oriented_service
description: "Strict policy pack for platforms with high youth audience concentration. Re-routes suggestive avatars to human review."
version: "1.0.0"

enabled_plugins:
  - image_gate
  - media_reuse
  - text_behavior
  - link_destination
  - actor_profile

image_gate:
  policy_profile: strict_avatar
  nudity_block_threshold: 0.70          # uncalibrated research placeholder (stricter)
  nudity_review_threshold: 0.35         # uncalibrated research placeholder (stricter)
  suggestive_tag_threshold: 0.45        # uncalibrated research placeholder (stricter)
  suggestive_action: REVIEW             # Non-negotiable youth safety: suggestive avatars routed to human review
  ocr_explicit_text_action: BLOCK
  review_behavior: HOLD_DEFAULT_AVATAR
  classifier_unavailable_action: HOLD_DEFAULT_AVATAR
  known_bad_hash_action: BLOCK
  tag_ttl_days: 14
  rescan_interval_days: 14
  review_sla_hours: 12
  cache_allowed_media: false

decision_engine:
  low_cutoff: 20
  medium_cutoff: 50
  high_cutoff: 70
  high_risk_min_families: 2
  critical_risk_min_families: 3
  weak_signal_families:
    - SUGGESTIVE_PRESENTATION
    - AI_LIKELIHOOD

retention:
  audit_retention_days: 730
  persist_blocked_images: false
