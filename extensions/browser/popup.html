<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SafeFlow Shield</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <div class="header">
      <div class="logo">SafeFlow Shield</div>
      <div class="status-badge active" id="shield-status">Active</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Defensive Node Status</div>
      <div class="metric-val" id="api-status">Connecting...</div>
    </div>
    <div class="info-text">
      Real-time client-side redirection funnel and cloaked destination interception.
    </div>
    <div class="actions">
      <button class="btn" id="rescan-btn">Scan Active Tab</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
